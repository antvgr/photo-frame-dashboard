<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home Screen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views/home.css">
  <link rel="stylesheet" href="css/views/calendar.css">
  <link rel="stylesheet" href="css/views/control.css">
  <link rel="stylesheet" href="css/views/player.css">
  <link rel="stylesheet" href="css/views/machines.css">
  <link rel="stylesheet" href="css/views/ambient.css">
</head>
<body>
  <div class="stage" id="stage" data-mode="day">
    <nav class="rail" id="rail" aria-label="Sections" data-i18n-aria="Sections">
      <button class="rail-item" data-go="home"><span class="rail-ico" data-ico="home"></span><span data-i18n="Today|nav">Today</span></button>
      <button class="rail-item" data-go="calendar"><span class="rail-ico" data-ico="calendar"></span><span data-i18n="Calendar">Calendar</span></button>
      <button class="rail-item" data-go="control"><span class="rail-ico" data-ico="bulb"></span><span data-i18n="Home">Home</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock — press and hold for demo controls" data-i18n-aria="Clock — press and hold for demo controls"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-control" data-view="control"></section>
      <section class="view view--bleed" id="view-player" data-view="player"></section>
      <section class="view" id="view-machines" data-view="machines"></section>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="ambient" id="ambient"></div>
    <div class="settings" id="settings"></div>
  </div>

  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(function () { if (!window.App) location.reload(); }, 10000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
